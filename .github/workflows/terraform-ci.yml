name: EDIP Terraform CI

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-ci.yml"

jobs:
  terraform-local-k8s:
    name: Validate local-k8s Terraform
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/terraform/local-k8s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

  terraform-bootstrap:
    name: Validate AWS bootstrap Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/aws-bootstrap
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  terraform-aws-static:
    name: Validate AWS Terraform statically
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/aws

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without backend
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform validate

  terraform-aws-plan:
    name: Plan AWS Terraform
    if: vars.AWS_TERRAFORM_AUTOMATION_ENABLED == 'true'
    needs: terraform-aws-static
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/terraform/aws
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_artifact_bucket_name: ${{ vars.AWS_ARTIFACT_BUCKET_NAME }}
      TF_VAR_github_oidc_provider_arn: ${{ vars.AWS_GITHUB_OIDC_PROVIDER_ARN }}
      TF_VAR_github_actions_release_oidc_subjects: ${{ vars.AWS_RELEASE_OIDC_SUBJECTS_JSON }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure read-only Terraform credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Initialize Terraform remote state
        run: terraform init -input=false -backend-config="bucket=${{ vars.AWS_TERRAFORM_STATE_BUCKET }}" -backend-config="key=${{ vars.AWS_TERRAFORM_STATE_KEY }}" -backend-config="region=${{ vars.AWS_REGION }}" -backend-config="encrypt=true" -backend-config="use_lockfile=true"

      - name: Plan Terraform changes
        run: terraform plan -input=false -no-color
