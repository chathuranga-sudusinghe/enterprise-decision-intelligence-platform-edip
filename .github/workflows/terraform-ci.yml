name: EDIP Terraform CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - dev
      - "feature/**"
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-ci.yml"
  pull_request:
    branches:
      - main
      - master
      - develop
      - dev
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-ci.yml"
  workflow_dispatch:

jobs:
  terraform-local-k8s:
    name: Validate local-k8s Terraform
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/terraform/local-k8s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate
