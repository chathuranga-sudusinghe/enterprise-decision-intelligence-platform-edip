# LOCAL DEVELOPMENT / LOCAL VALIDATION ONLY.
# Cloud deployments configure the serving image and model delivery separately.

services:
  api: # FastAPI application
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edip-api
    ports:
      - "127.0.0.1:${FAVORITA_API_HOST_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      APP_ENV: local
      EDIP_FAVORITA_MODEL_BUNDLE_PATH: /models/favorita
    volumes:
      - type: bind
        source: ${FAVORITA_MODEL_BUNDLE_DIR:-./artifacts/models/favorita_time_aware}
        target: /models/favorita
        read_only: true
        bind:
          create_host_path: false
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
  
  prometheus: # Prometheus metrics collector
    image: prom/prometheus:latest
    container_name: edip-prometheus
    depends_on:
      - api
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  grafana: # Grafana dashboard
    image: grafana/grafana:latest
    container_name: edip-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
    restart: unless-stopped

  postgres: # PostgreSQL retained for EDIP application persistence
    image: postgres:16
    container_name: edip-postgres
    environment:
      POSTGRES_USER: edip
      POSTGRES_PASSWORD: edip
      POSTGRES_DB: edip
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edip -d edip"]
      interval: 10s
      timeout: 5s
      retries: 10
    
volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
